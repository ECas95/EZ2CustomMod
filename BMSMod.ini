[Core]
Enable=1

[Debug]
EnableLog=1
; NOT a diagnostic despite the name: the song-select injection, the category filter, the wheel
; window and the frame-end hook are all installed from here. Turning it off disables the mod.
EnableFunctionTrace=1
TraceGameLog=0
TraceFileApi=0
TraceBMSScan=0
; Per-judgement hooks: each one pays a pushad, a 0x214-byte frame and an fxsave. Off for play.
; Turn it on for two or three songs and each leaves a "[judge] song stats" line in the log with
; the JudgeOffsetMs it suggests for your setup, then turn it back off.
TraceJudge=0
; Diagnostics with a runtime cost. Leave both at 0 on the cabinet.
;   GsProbe      names the function whose stack cookie was smashed; sits on the
;                return path of 275 functions.
;   HangWatchdog reports where a frozen thread is stuck; suspends and resumes every
;                thread in the process every 2 seconds, which a single-core machine feels.
GsProbe=0
HangWatchdog=0
ShowInjectedMessageBox=0
ShowProgressPopup=1

[Video]
AltEnter=1
BorderlessOnly=1
CaptureExistingWindow=1

[CustomSongs]
EnableBMSData=1
Root=BMSData
CacheRoot=CustomCache
PageSize=400
EnableSongSelectInject=1
BridgeMode=1
ModifyOriginalFiles=0
UseNativeSongBinAsBase=1
UseNativeStageIniAsBase=1
FlatSongFolder=1
RecursiveSongAssets=0
InferAssetsFromBMS=1
InferMetadataFromBMS=1
GenerateCacheManifest=1
RedirectCustomToNative=0
RedirectNativeId=babydance
PinCustomAtTop=0
ForceSelectCustom=0

; Rate charts from their own note data instead of trusting #PLAYLEVEL. The declared level stops
; discriminating at the top: 46% of songs call their hardest chart 18, and inside that one level
; the busiest two seconds run from 13 to 83 notes a second. 0 = show what the BMS declares.
LevelFromNotes=1

; The two caches that dominate the process's address space, in MB. 0 = sized from the machine:
; 384/256 on a 64-bit host, 256/160 with a 3 GB process, 128/96 on XP 32-bit (2 GB) or under
; 1.5 GB of RAM -- the smallest tier also caps PreviewFps at 10. The log's "[config] memory tier"
; line says which was picked. Any other number is used as given.
KeysoundCacheMB=0
AssetCacheMB=0

[AutoChart]
; Creates virtual target-mode charts from the source mode's folder without rewriting the BMS files.
; SourceMode must be a folder that actually HAS charts under BMSData\ (here: BMSData\5KeyMix).
; If it has none, the DLL falls back to the scanned mode with the most songs and logs the switch.
Enable=1
SourceMode=5keyMix
TargetModes=5keyMix,streetMix,7keyMix,clubMix,spaceMix,rubyMix,ez2Catch,turnTable,cv2Mix

; 100 = native-model density. 0 disables generated special controls, 200 doubles it.
Intensity=100
Seed=1337

; The source mode's songs are the author's own charts and are never redistributed. A raw 5-key BMS
; has no scratch or pedal, but 5-key standard really has both: this adds only those two controls
; and leaves the authored lane pattern untouched. 0 = play the source mode's charts exactly as written.
EnrichSourceMode=1

; Reads native FNEX .es/.ez charts and learns scratch/pedal timing and density.
LearnNativeCharts=1
NativeChartRoot=SOUND
NativeModelMaxChartsPerMode=192

[Gameplay]
; Song-select and gameplay extras. Every one can be switched off on its own.
HudPanel=1
; The two read-outs for the chart under the cursor in song select: the figures above the disc
; (notes, NPS, peak, chords, jacks) and the density graph along the bottom.
DetailPanels=1
; Custom songs' names and discs reuse a fixed set of textures instead of adding one per song seen.
; The game never frees a texture while song select is open, so without this a long browse runs
; the process into Windows' GDI object limit and art stops loading. 0 = the old behaviour.
TextureRing=1
; The game's Korean menu textures in English: Translation\system\... is shown in place of the
; same file under system\ (rebuilt with tools\texture_translate.py). The originals are untouched;
; 0, or removing the Translation folder, brings the Korean back.
EnglishTextures=1
; FAVORITES, RECENT and MOST PLAYED lead the custom categories in every mode. PEDAL + E1 on a song
; adds it to FAVORITES or takes it out; every song played counts for the other two. Kept per song
; folder in CustomCache\playdata.txt, so they hold across modes and restarts. Until there is
; something to show, each lists 30 random picks.
VirtualCategories=1
; SUDDEN+ lane cover (as in IIDX) over the top of the lanes, in every key mode except the scratch
; modes and Ez2Catch. In play, hold E1 and turn the turntable to raise or lower it; a quick tap of
; E1 still toggles bass boost (on release). The size is saved here as you set it: 0..1000 of the way
; down to the judge line, 0 = no cover. LaneCoverStep is how fast it follows the turntable
; (negative reverses the direction). LaneCoverImage is a picture in the LaneCover folder
; (png/jpg/bmp, stretched to the lanes); empty = plain black. In song select, hold PEDAL + E4 to
; pick it from a list with a thumbnail (E2/E3 change, E1 keeps, E4 leaves).
LaneCover=1
LaneCoverSize=160
LaneCoverStep=8
LaneCoverImage=
; Custom courses in the four Radio Mix modes, built from the custom songs: four songs from one level
; band (1-4, 5-8, 9-12, 13-16, 17-20), easiest first, listed after the game's own channels as
; CUSTOM COURSE 1, 2, ... The course list holds 100 channels, so 5RadioMix has room for 14 at most.
; 0 = none (the game's own lists, untouched).
CustomCourses=12
; Frames a second for the BGA preview on the disc in song select. The clip is decoded whole
; into memory first, so it is a straight trade: 192 KB a frame, 12 seconds of them.
; 10 = 23 MB (the old fixed rate), 20 = 46 MB, 30 = 69 MB. The source clips are 30 fps.
PreviewFps=20
CategorySort=1
ConstantSpeed=1
CustomTop5=1
ArtPrefetch=1
; Where the notice card sits in song select (pixels, 640x480).
HudPanelX=296
HudPanelY=86
; 0 = the display paces the game; N = hold frames to 1/N s at the frame end.
FpsLimit=0
; Judge offset in milliseconds, applied to every chart (native and custom). Positive means
; "my presses arrive late, count them earlier". With TraceJudge=1 each song leaves a
; "[judge] song stats" line in the log with a suggested value; 0 = the game as shipped.
JudgeOffsetMs=0
